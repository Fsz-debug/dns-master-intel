name: Update Firebog intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: write

jobs:
  firebog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Firebog intelligence
        run: python3 src/build_firebog_intel.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/firebog-*.txt dist/firebog-report.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Firebog intelligence"
            git push
          fi
